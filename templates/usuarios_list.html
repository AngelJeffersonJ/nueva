{% extends "layout.html" %}
{% block title %}Usuarios{% endblock %}
{% block content %}
<div class="d-flex justify-content-between mb-2">
  <h3>Usuarios (Asignar Roles)</h3>
  <a class="btn btn-success" href="{{ url_for('usuarios_new') }}">Nuevo Usuario</a>
</div>
<table class="table table-striped">
  <thead>
    <tr><th>Correo</th><th>Rol</th><th>Área</th><th>Acciones</th></tr>
  </thead>
  <tbody>
    {% for u in usuarios %}
    <tr>
      <td>{{u.correo}}</td>
      <td>{{u.rol}}</td>
      <td>{{u.area}}</td>
      <td>
        <a class="btn btn-sm btn-primary" href="{{ url_for('usuarios_edit', correo=u.correo) }}">✎</a>
        <form class="d-inline" method="post" action="{{ url_for('usuarios_delete', correo=u.correo) }}">
          <button class="btn btn-sm btn-danger">🗑</button>
        </form>
      </td>
    </tr>
    {% endfor %}
  </tbody>
</table>
{% endblock %}
