{% extends "layout.html" %}
{% block content %}
<h2>Usuarios</h2>
<a class="btn btn-primary mb-2" href="{{ url_for('usuarios_new') }}">Nuevo Usuario</a>
<table class="table table-bordered table-sm">
  <thead>
    <tr>
      <th>Correo</th><th>Rol</th><th>Área</th><th>Acciones</th>
    </tr>
  </thead>
  <tbody>
  {% for u in usuarios %}
    <tr>
      <td>{{ u['correo'] }}</td>
      <td>{{ u['rol'] }}</td>
      <td>{{ u['area'] }}</td>
      <td>
        <a class="btn btn-sm btn-info" href="{{ url_for('usuarios_edit', correo=u['correo']) }}">Editar</a>
        <a class="btn btn-sm btn-danger" href="{{ url_for('usuarios_delete', correo=u['correo']) }}">Eliminar</a>
      </td>
    </tr>
  {% endfor %}
  </tbody>
</table>
{% endblock %}
