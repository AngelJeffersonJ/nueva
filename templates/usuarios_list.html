{% extends "layout.html" %}
{% block title %}Usuarios{% endblock %}
{% block content %}
<div class="d-flex justify-content-between align-items-center mb-3">
  <h3>Usuarios</h3>
  <a href="{{ url_for('usuarios_new') }}" class="btn btn-success">Nuevo Usuario</a>
</div>
<table class="table table-striped">
  <thead>
    <tr><th>Correo</th><th>Rol</th><th>Área</th><th>Acciones</th></tr>
  </thead>
  <tbody>
    {% for u in usuarios %}
    <tr>
      <td>{{ u.correo }}</td>
      <td>{{ u.rol }}</td>
      <td>{{ u.area }}</td>
      <td>
        <a class="btn btn-sm btn-primary" href="{{ url_for('usuarios_edit', correo=u.correo) }}">Editar</a>
        <form class="d-inline" method="post" action="{{ url_for('usuarios_delete', correo=u.correo) }}">
          <button class="btn btn-sm btn-danger">Eliminar</button>
        </form>
      </td>
    </tr>
    {% endfor %}
  </tbody>
</table>
{% endblock %}
