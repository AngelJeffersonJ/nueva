{% extends "layout.html" %}
{% block content %}
<h2>{{ profesor.get('correo') and 'Editar' or 'Nuevo' }} Profesor</h2>
<form method="post">
  <div class="form-group">
    <label>Correo</label>
    <input class="form-control" name="correo" required value="{{ profesor.get('correo','') }}" {% if profesor.get('correo') %}readonly{% endif %}>
  </div>
  <div class="form-group">
    <label>Nombre</label>
    <input class="form-control" name="nombre" required value="{{ profesor.get('nombre','') }}">
  </div>
  <div class="form-group">
    <label>Área</label>
    <input class="form-control" name="area" value="{{ profesor.get('area','') }}">
  </div>
  <button class="btn btn-success" type="submit">Guardar</button>
  <a class="btn btn-secondary" href="{{ url_for('profesores_list') }}">Cancelar</a>
</form>
{% endblock %}
