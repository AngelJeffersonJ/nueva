{% extends 'layout.html' %}
{% block title %}{{ profesor.correo and 'Editar' or 'Nuevo' }} Profesor{% endblock %}
{% block content %}
<h3>{{ profesor.correo and 'Editar' or 'Nuevo' }} Profesor</h3>
<form method="post">
  <div class="mb-3">
    <label class="form-label">Correo</label>
    <input type="email" name="correo" class="form-control"
           value="{{ profesor.correo or '' }}"
           {% if profesor.correo %}readonly{% endif %} required>
  </div>
  <div class="mb-3">
    <label class="form-label">Nombre</label>
    <input type="text" name="nombre" class="form-control"
           value="{{ profesor.nombre or '' }}" required>
  </div>
  <div class="mb-3">
    <label class="form-label">Área</label>
    <input type="text" name="area" class="form-control" value="{{ profesor.area or '' }}">
  </div>
  <button class="btn btn-primary">Guardar</button>
  <a class="btn btn-secondary" href="{{ url_for('profesores_list') }}">Cancelar</a>
</form>
{% endblock %}
