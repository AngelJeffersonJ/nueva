{% extends "layout.html" %}
{% block content %}
<h2>Áreas</h2>
<a class="btn btn-primary mb-2" href="{{ url_for('areas_new') }}">Nueva Área</a>
<table class="table table-bordered table-sm">
  <thead>
    <tr><th>Nombre</th><th>Encargado</th><th>Acciones</th></tr>
  </thead>
  <tbody>
  {% for a in areas %}
    <tr>
      <td>{{ a['nombre'] }}</td>
      <td>{{ a['encargado'] }}</td>
      <td>
        <a class="btn btn-sm btn-info" href="{{ url_for('areas_edit', id=a['id']) }}">Editar</a>
        <a class="btn btn-sm btn-danger" href="{{ url_for('areas_delete', id=a['id']) }}">Eliminar</a>
      </td>
    </tr>
  {% endfor %}
  </tbody>
</table>
{% endblock %}
