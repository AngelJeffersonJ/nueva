{% extends "layout.html" %}
{% block title %}Áreas{% endblock %}
{% block content %}
<div class="d-flex justify-content-between mb-3">
  <h3>Áreas</h3>
  <a href="{{ url_for('areas_new') }}" class="btn btn-success">Nueva Área</a>
</div>
<table class="table table-striped">
  <thead>
    <tr>
      <th>Nombre</th><th>Encargado</th><th>Acciones</th>
    </tr>
  </thead>
  <tbody>
    {% for a in areas %}
    <tr>
      <td>{{ a.nombre }}</td>
      <td>{{ a.encargado }}</td>
      <td>
        <a class="btn btn-sm btn-primary" href="{{ url_for('areas_edit', id=a.id) }}">Editar</a>
        <a class="btn btn-sm btn-danger"  href="{{ url_for('areas_delete', id=a.id) }}">Eliminar</a>
      </td>
    </tr>
    {% endfor %}
  </tbody>
</table>
{% endblock %}
