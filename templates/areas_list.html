{% extends "layout.html" %}
{% block title %}Áreas{% endblock %}

{% block content %}
<div class="d-flex justify-content-between mb-3">
  <h3>Áreas</h3>
  <a href="{{ url_for('areas_new') }}" class="btn btn-success">Nueva Área</a>
</div>
<table class="table table-bordered table-hover">
  <thead class="table-dark">
    <tr><th>ID</th><th>Nombre</th><th>Encargado</th><th>Acciones</th></tr>
  </thead>
  <tbody>
    {% for a in areas %}
    <tr>
      <td>{{ a.id }}</td>
      <td>{{ a.nombre }}</td>
      <td>{{ a.encargado }}</td>
      <td>
        <a href="{{ url_for('areas_edit', id=a.id) }}" class="btn btn-sm btn-warning">✎</a>
        <form action="{{ url_for('areas_delete', id=a.id) }}" method="post" style="display:inline;">
          <button class="btn btn-sm btn-danger">🗑</button>
        </form>
      </td>
    </tr>
    {% endfor %}
  </tbody>
</table>
{% endblock %}
