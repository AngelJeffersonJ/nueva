{% extends "layout.html" %}
{% block title %}{{ valores[campos[0]] and 'Editar' or 'Nuevo' }} {{ tipo|capitalize }}{% endblock %}
{% block content %}
<h2>{{ valores[campos[0]] and 'Editar' or 'Nuevo' }} {{ tipo|capitalize }}</h2>

<form method="post">
  <div class="row">
    {% for campo in campos %}
      <div class="col-md-6 mb-3">
        <label class="form-label">{{ campo|capitalize|replace('_',' ') }}</label>
        <input type="text" name="{{ campo }}" class="form-control"
               value="{{ valores.get(campo,'') }}"
               {% if campo=='id' and valores.get(campo) %}readonly{% endif %}
               {% if campo in ['correo','nombre'] and tipo=='usuarios' %}required{% endif %}>
      </div>
    {% endfor %}
  </div>
  <button class="btn btn-primary">Guardar</button>
  <a href="{{ url_for('entidad_list', tipo=tipo) }}" class="btn btn-secondary">Cancelar</a>
</form>
{% endblock %}
