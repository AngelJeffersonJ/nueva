{% extends "layout.html" %}
{% block title %}{{ valores and 'Editar' or 'Nuevo' }} {{ tipo|capitalize }}{% endblock %}
{% block content %}
<h3>{{ valores and 'Editar' or 'Nuevo' }} {{ tipo|capitalize }}</h3>
<form method="post">
  <div class="row">
    {% for campo in campos %}
      <div class="col-md-6 mb-3">
        <label class="form-label">{{ campo.replace('_',' ')|capitalize }}</label>
        <input
          type="text"
          name="{{ campo }}"
          class="form-control"
          value="{{ valores.get(campo, '') }}"
          {% if valores and loop.first %} readonly {% endif %}
          required
        >
      </div>
    {% endfor %}
  </div>
  <button class="btn btn-primary">Guardar</button>
  <a href="{{ url_for('entidad_list', tipo=tipo) }}" class="btn btn-secondary">Cancelar</a>
</form>
{% endblock %}
