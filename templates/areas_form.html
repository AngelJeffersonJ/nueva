{% extends "layout.html" %}
{% block title %}Área{% endblock %}
{% block content %}
  {% set area = area if area is defined else {} %}

  <h3>{% if area.get('id') %}Editar Área{% else %}Nueva Área{% endif %}</h3>
  <form method="post">
    <div class="mb-3">
      <label class="form-label">Nombre</label>
      <input type="text" name="nombre" class="form-control"
             value="{{ area.get('nombre','') }}" required>
    </div>
    <div class="mb-3">
      <label class="form-label">Encargado (correo)</label>
      <input type="email" name="encargado" class="form-control"
             value="{{ area.get('encargado','') }}">
    </div>
    <button class="btn btn-primary">Guardar</button>
    <a href="{{ url_for('areas_list') }}" class="btn btn-secondary">Cancelar</a>
  </form>
{% endblock %}
