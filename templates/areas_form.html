{% extends "layout.html" %}
{% block content %}
<h2>{{ area.get('id') and 'Editar' or 'Nueva' }} Área</h2>
<form method="post">
  <div class="form-group">
    <label>Nombre</label>
    <input class="form-control" name="nombre" required value="{{ area.get('nombre','') }}">
  </div>
  <div class="form-group">
    <label>Encargado</label>
    <input class="form-control" name="encargado" value="{{ area.get('encargado','') }}">
  </div>
  <button class="btn btn-success" type="submit">Guardar</button>
  <a class="btn btn-secondary" href="{{ url_for('areas_list') }}">Cancelar</a>
</form>
{% endblock %}
