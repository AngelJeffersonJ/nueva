{% extends "layout.html" %}
{% block title %}Alumnos{% endblock %}
{% block content %}
<div class="d-flex justify-content-between mb-3">
  <h3>Alumnos</h3>
  <a href="{{ url_for('alumnos_new') }}" class="btn btn-success">Nuevo Alumno</a>
</div>
<table class="table table-striped">
  <thead>
    <tr>
      <th>No. Control</th><th>Nombre</th><th>Área</th><th>Profesor</th><th>Acciones</th>
    </tr>
  </thead>
  <tbody>
    {% for a in alumnos %}
    <tr>
      <td>{{ a.no_control }}</td>
      <td>{{ a.nombre     }}</td>
      <td>{{ a.area       }}</td>
      <td>{{ a.profesor   }}</td>
      <td>
        <a class="btn btn-sm btn-primary" href="{{ url_for('alumnos_edit',   no_control=a.no_control) }}">Editar</a>
        <a class="btn btn-sm btn-danger"  href="{{ url_for('alumnos_delete', no_control=a.no_control) }}">Eliminar</a>
      </td>
    </tr>
    {% endfor %}
  </tbody>
</table>
{% endblock %}
