{% extends "layout.html" %}
{% block title %}Profesores{% endblock %}

{% block content %}
<div class="d-flex justify-content-between mb-3">
  <h3>Profesores</h3>
  <a href="{{ url_for('profesores_new') }}" class="btn btn-success">Nuevo Profesor</a>
</div>
<table class="table table-bordered table-hover">
  <thead class="table-dark">
    <tr><th>Correo</th><th>Nombre</th><th>Área</th><th>Acciones</th></tr>
  </thead>
  <tbody>
    {% for p in profesores %}
    <tr>
      <td>{{ p.correo }}</td>
      <td>{{ p.nombre }}</td>
      <td>{{ p.area }}</td>
      <td>
        <a href="{{ url_for('profesores_edit', correo=p.correo) }}" class="btn btn-sm btn-warning">✎</a>
        <form action="{{ url_for('profesores_delete', correo=p.correo) }}" method="post" style="display:inline;">
          <button class="btn btn-sm btn-danger">🗑</button>
        </form>
      </td>
    </tr>
    {% endfor %}
  </tbody>
</table>
{% endblock %}
