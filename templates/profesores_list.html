{% extends "layout.html" %}
{% block title %}Profesores{% endblock %}
{% block content %}
<div class="d-flex justify-content-between mb-3">
  <h3>Profesores</h3>
  <a href="{{ url_for('profesores_new') }}" class="btn btn-success">Nuevo Profesor</a>
</div>
<table class="table table-striped">
  <thead>
    <tr><th>Correo</th><th>Nombre</th><th>Área</th><th>Acciones</th></tr>
  </thead>
  <tbody>
    {% for p in profesores %}
    <tr>
      <td>{{ p.correo }}</td>
      <td>{{ p.nombre }}</td>
      <td>{{ p.area }}</td>
      <td>
        <a class="btn btn-sm btn-primary" href="{{ url_for('profesores_edit', correo=p.correo) }}">Editar</a>
        <a class="btn btn-sm btn-danger"  href="{{ url_for('profesores_delete', correo=p.correo) }}">Eliminar</a>
      </td>
    </tr>
    {% endfor %}
  </tbody>
</table>
{% endblock %}
