{% extends "layout.html" %}
{% block title %}Profesores{% endblock %}
{% block content %}
<div class="d-flex justify-content-between align-items-center mb-3">
  <h3>Profesores</h3>
  <a href="{{ url_for('profesores_new') }}" class="btn btn-success">Nuevo Profesor</a>
</div>
<table class="table table-striped">
  <thead><tr><th>Correo</th><th>Nombre</th><th>Área</th><th>Acciones</th></tr></thead>
  <tbody>
    {% for p in profesores %}
    <tr>
      <td>{{ p.correo }}</td>
      <td>{{ p.nombre }}</td>
      <td>{{ p.area }}</td>
      <td>
        <a class="btn btn-sm btn-primary" href="{{ url_for('profesores_edit', correo=p.correo) }}">Editar</a>
        <form class="d-inline" method="post" action="{{ url_for('profesores_delete', correo=p.correo) }}">
          <button class="btn btn-sm btn-danger">Eliminar</button>
        </form>
      </td>
    </tr>
    {% endfor %}
  </tbody>
</table>
{% endblock %}
