{% extends "layout.html" %}
{% block content %}
<h2>Profesores</h2>
<a class="btn btn-primary mb-2" href="{{ url_for('profesores_new') }}">Nuevo Profesor</a>
<table class="table table-bordered table-sm">
  <thead>
    <tr><th>Correo</th><th>Nombre</th><th>Área</th><th>Acciones</th></tr>
  </thead>
  <tbody>
  {% for p in profesores %}
    <tr>
      <td>{{ p['correo'] }}</td>
      <td>{{ p['nombre'] }}</td>
      <td>{{ p['area'] }}</td>
      <td>
        <a class="btn btn-sm btn-info" href="{{ url_for('profesores_edit', correo=p['correo']) }}">Editar</a>
        <a class="btn btn-sm btn-danger" href="{{ url_for('profesores_delete', correo=p['correo']) }}">Eliminar</a>
      </td>
    </tr>
  {% endfor %}
  </tbody>
</table>
{% endblock %}
