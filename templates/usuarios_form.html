{% extends "layout.html" %}
{% block title %}{{ usuario and 'Editar' or 'Nuevo' }} Usuario{% endblock %}
{% block content %}
<h3>{{ usuario and 'Editar' or 'Nuevo' }} Usuario</h3>
<form method="post">
  <div class="mb-3">
    <label class="form-label">Correo</label>
    <input name="correo" type="email" class="form-control" value="{{ usuario.correo or '' }}" {% if usuario %}readonly{% endif %} required>
  </div>
  <div class="mb-3">
    <label class="form-label">Rol</label>
    <select name="rol" class="form-select" required>
      <option value="Administrador"   {% if usuario.rol=='Administrador' %}selected{% endif %}>Administrador</option>
      <option value="Encargado"        {% if usuario.rol=='Encargado' %}selected{% endif %}>Encargado</option>
      <option value="Maestro"         {% if usuario.rol=='Maestro' %}selected{% endif %}>Maestro</option>
      <option value="Alumno"          {% if usuario.rol=='Alumno' %}selected{% endif %}>Alumno</option>
    </select>
  </div>
  <div class="mb-3">
    <label class="form-label">Área</label>
    <input name="area" type="text" class="form-control" value="{{ usuario.area or '' }}">
  </div>
  <button class="btn btn-primary">Guardar</button>
  <a href="{{ url_for('usuarios_list') }}" class="btn btn-secondary">Cancelar</a>
</form>
{% endblock %}
