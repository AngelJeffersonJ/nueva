{% extends "layout.html" %}
{% block title %}Nuevo Usuario{% endblock %}
{% block content %}

<h3>{{ usuario.correo and "Editar" or "Nuevo" }} Usuario</h3>

<form method="post">
  <div class="form-group">
    <label>Correo</label>
    <input type="email" name="correo" class="form-control" required
           value="{{ usuario.correo }}" {{ usuario.correo and "readonly" }}>
  </div>

  <div class="form-group">
    <label>Rol</label>
    <select name="rol" class="form-control" required>
      <option value="Administrador" {{ "selected" if usuario.rol == "Administrador" }}>Administrador</option>
      <option value="Encargado" {{ "selected" if usuario.rol == "Encargado" }}>Encargado</option>
      <option value="Maestro" {{ "selected" if usuario.rol == "Maestro" }}>Maestro</option>
      <option value="Alumno" {{ "selected" if usuario.rol == "Alumno" }}>Alumno</option>
    </select>
  </div>

  <div class="form-group">
    <label>Área</label>
    <input type="text" name="area" class="form-control" value="{{ usuario.area }}">
  </div>

  <button type="submit" class="btn btn-primary">Guardar</button>
  <a class="btn btn-secondary" href="{{ url_for('usuarios_list') }}">Cancelar</a>
</form>

{% endblock %}
