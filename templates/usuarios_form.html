{% extends "layout.html" %}
{% block content %}
<h2>{{ usuario.get('correo') and 'Editar' or 'Nuevo' }} Usuario</h2>
<form method="post">
  <div class="form-group">
    <label>Correo</label>
    <input class="form-control" name="correo" required value="{{ usuario.get('correo','') }}" {% if usuario.get('correo') %}readonly{% endif %}>
  </div>
  <div class="form-group">
    <label>Rol</label>
    <select class="form-control" name="rol" required>
      {% for r in ['Administrador','Encargado','Maestro','Alumno'] %}
      <option value="{{ r }}" {% if usuario.get('rol','')==r %}selected{% endif %}>{{ r }}</option>
      {% endfor %}
    </select>
  </div>
  <div class="form-group">
    <label>Área</label>
    <input class="form-control" name="area" value="{{ usuario.get('area','') }}">
  </div>
  <button class="btn btn-success" type="submit">Guardar</button>
  <a class="btn btn-secondary" href="{{ url_for('usuarios_list') }}">Cancelar</a>
</form>
{% endblock %}
