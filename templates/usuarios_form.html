{% extends "layout.html" %}
{% block title %}{{ usuario.correo and 'Editar' or 'Nuevo' }} Usuario{% endblock %}
{% block content %}
<h2>{{ usuario.correo and 'Editar' or 'Nuevo' }} Usuario</h2>
<form method="post">
  <div class="mb-3">
    <label class="form-label">Correo</label>
    <input type="email" name="correo" class="form-control"
           value="{{ usuario.correo or '' }}"
           {% if usuario.correo %}readonly{% endif %} required>
  </div>
  <div class="mb-3">
    <label class="form-label">Rol</label>
    <select name="rol" class="form-select" required>
      {% for r in ['Administrador','Encargado','Maestro','Alumno'] %}
        <option value="{{ r }}" {% if usuario.rol==r %}selected{% endif %}>{{ r }}</option>
      {% endfor %}
    </select>
  </div>
  <div class="mb-3">
    <label class="form-label">Área (opcional)</label>
    <input type="text" name="area" class="form-control" value="{{ usuario.area or '' }}">
  </div>
  <button class="btn btn-primary">Guardar</button>
  <a href="{{ url_for('usuarios_list') }}" class="btn btn-secondary">Cancelar</a>
</form>
{% endblock %}
