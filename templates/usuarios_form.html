{% extends "layout.html" %}
{% block title %}Usuario{% endblock %}
{% block content %}
<h3>{% if usuario.correo %}Editar{% else %}Nuevo{% endif %} Usuario</h3>
<form method="post">
  <div class="mb-3">
    <label class="form-label">Correo</label>
    <input type="email" name="correo" class="form-control"
           value="{{ usuario.correo or '' }}" {% if usuario.correo %} readonly{% endif %} required>
  </div>
  <div class="mb-3">
    <label class="form-label">Rol</label>
    <select name="rol" class="form-control">
      <option{% if usuario.rol=='Administrador' %} selected{% endif %}>Administrador</option>
      <option{% if usuario.rol=='Encargado' %} selected{% endif %}>Encargado</option>
      <option{% if usuario.rol=='Maestro' %} selected{% endif %}>Maestro</option>
      <option{% if usuario.rol=='Alumno' %} selected{% endif %}>Alumno</option>
    </select>
  </div>
  <div class="mb-3">
    <label class="form-label">Área</label>
    <input name="area" class="form-control" value="{{ usuario.area or '' }}">
  </div>
  <button class="btn btn-primary">Guardar</button>
  <a href="{{ url_for('usuarios_list') }}" class="btn btn-secondary">Cancelar</a>
</form>
{% endblock %}
