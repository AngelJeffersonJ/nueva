{% extends "layout.html" %}
{% block title %}Usuario{% endblock %}
{% block content %}
  {% set usuario = usuario if usuario is defined else {} %}

  <h3>{% if usuario.get('correo') %}Editar Usuario{% else %}Nuevo Usuario{% endif %}</h3>
  <form method="post">
    <div class="mb-3">
      <label class="form-label">Correo</label>
      <input type="email" name="correo" class="form-control"
             value="{{ usuario.get('correo','') }}"
             {% if usuario.get('correo') %}readonly{% endif %} required>
    </div>
    <div class="mb-3">
      <label class="form-label">Rol</label>
      <input type="text" name="rol" class="form-control"
             value="{{ usuario.get('rol','') }}" required>
    </div>
    <div class="mb-3">
      <label class="form-label">Área</label>
      <input type="text" name="area" class="form-control"
             value="{{ usuario.get('area','') }}">
    </div>
    <button class="btn btn-primary">Guardar</button>
    <a href="{{ url_for('usuarios_list') }}" class="btn btn-secondary">Cancelar</a>
  </form>
{% endblock %}
