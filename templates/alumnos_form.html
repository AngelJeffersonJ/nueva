{% extends "layout.html" %}
{% block content %}
<h2>{{ alumno.get('No_Control') and 'Editar' or 'Nuevo' }} Alumno</h2>
<form method="post">
  <div class="form-group">
    <label>No. Control</label>
    <input class="form-control" name="No_Control" required value="{{ alumno.get('No_Control','') }}" {% if alumno.get('No_Control') %}readonly{% endif %}>
  </div>
  <div class="form-group">
    <label>Nombre</label>
    <input class="form-control" name="nombre" required value="{{ alumno.get('nombre','') }}">
  </div>
  <div class="form-group">
    <label>Área</label>
    <input class="form-control" name="area" value="{{ alumno.get('area','') }}">
  </div>
  <div class="form-group">
    <label>Profesor</label>
    <input class="form-control" name="profesor" value="{{ alumno.get('profesor','') }}">
  </div>
  <button class="btn btn-success" type="submit">Guardar</button>
  <a class="btn btn-secondary" href="{{ url_for('alumnos_list') }}">Cancelar</a>
</form>
{% endblock %}
