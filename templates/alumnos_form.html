{% extends "layout.html" %}
{% block title %}{{ alumno and 'Editar' or 'Nuevo' }} Alumno{% endblock %}
{% block content %}
<h3>{{ alumno and 'Editar' or 'Nuevo' }} Alumno</h3>
<form method="post">
  <div class="mb-3">
    <label class="form-label">Correo</label>
    <input name="correo" type="email" class="form-control" value="{{ alumno.correo or '' }}" {% if alumno %}readonly{% endif %} required>
  </div>
  <div class="mb-3">
    <label class="form-label">Nombre</label>
    <input name="nombre" class="form-control" value="{{ alumno.nombre or '' }}" required>
  </div>
  <div class="mb-3">
    <label class="form-label">Área</label>
    <input name="area" class="form-control" value="{{ alumno.area or '' }}">
  </div>
  <div class="mb-3">
    <label class="form-label">Profesor (correo)</label>
    <input name="profesor" type="email" class="form-control" value="{{ alumno.profesor or '' }}">
  </div>
  <button class="btn btn-primary">Guardar</button>
  <a class="btn btn-secondary" href="{{ url_for('alumnos_list') }}">Cancelar</a>
</form>
{% endblock %}
