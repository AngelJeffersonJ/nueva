{% extends "layout.html" %}
{% block title %}{{ alumno.No_Control and 'Editar' or 'Nuevo' }} Alumno{% endblock %}

{% block content %}
<h3>{{ alumno.No_Control and 'Editar' or 'Nuevo' }} Alumno</h3>
<form method="post">
  <div class="mb-3">
    <label class="form-label">No. Control</label>
    <input name="No_Control" class="form-control" value="{{ alumno.No_Control or '' }}"
           {% if alumno.No_Control %}readonly{% endif %} required>
  </div>
  <div class="mb-3">
    <label class="form-label">Nombre</label>
    <input name="Nombre" class="form-control" value="{{ alumno.Nombre or '' }}" required>
  </div>
  <div class="mb-3">
    <label class="form-label">Apellido Paterno</label>
    <input name="Apellido_Paterno" class="form-control" value="{{ alumno.Apellido_Paterno or '' }}" required>
  </div>
  <div class="mb-3">
    <label class="form-label">Apellido Materno</label>
    <input name="Apellido_Materno" class="form-control" value="{{ alumno.Apellido_Materno or '' }}">
  </div>
  <div class="mb-3">
    <label class="form-label">Carrera</label>
    <input name="Carrera" class="form-control" value="{{ alumno.Carrera or '' }}">
  </div>
  <div class="mb-3">
    <label class="form-label">Área</label>
    <input name="area" class="form-control" value="{{ alumno.area or '' }}">
  </div>
  <div class="mb-3">
    <label class="form-label">Profesor (correo)</label>
    <input name="profesor" class="form-control" value="{{ alumno.profesor or '' }}">
  </div>
  <button class="btn btn-primary">Guardar</button>
  <a class="btn btn-secondary" href="{{ url_for('alumnos_list') }}">Cancelar</a>
</form>
{% endblock %}
