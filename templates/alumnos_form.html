{% extends "layout.html" %}
{% block title %}{{ alumno.No_Control and 'Editar' or 'Nuevo' }} Alumno{% endblock %}
{% block content %}
<h2>{{ alumno.No_Control and 'Editar' or 'Nuevo' }} Alumno</h2>
<form method="post">
  <div class="mb-3">
    <label class="form-label">No. de Control</label>
    <input type="text" name="No_Control" class="form-control"
           value="{{ alumno.No_Control or '' }}"
           {% if alumno.No_Control %}readonly{% endif %} required>
  </div>
  <div class="mb-3">
    <label class="form-label">Nombre</label>
    <input type="text" name="nombre" class="form-control"
           value="{{ alumno.nombre or '' }}" required>
  </div>
  <div class="mb-3">
    <label class="form-label">Área</label>
    <input type="text" name="area" class="form-control" value="{{ alumno.area or '' }}">
  </div>
  <div class="mb-3">
    <label class="form-label">Profesor (correo)</label>
    <input type="email" name="profesor" class="form-control" value="{{ alumno.profesor or '' }}">
  </div>
  <button class="btn btn-primary">Guardar</button>
  <a href="{{ url_for('alumnos_list') }}" class="btn btn-secondary">Cancelar</a>
</form>
{% endblock %}
