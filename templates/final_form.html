{% extends "layout.html" %}
{% block title %}Reporte Final – {{ no_control }}{% endblock %}
{% block content %}
<h3>Reporte Final ({{ no_control }})</h3>
<form method="post">
  <input type="hidden" name="No_Control" value="{{ no_control }}">
  <input type="hidden" name="Num_Control" value="{{ no_control }}">

  <div class="row mb-3">
    <div class="col">
      <label class="form-label">Municipio</label>
      <input type="text" name="Municipio" class="form-control"
             value="{{ documento.Municipio or '' }}" required>
    </div>
    <div class="col">
      <label class="form-label">Estado</label>
      <input type="text" name="Estado" class="form-control"
             value="{{ documento.Estado or '' }}" required>
    </div>
  </div>

  {% for i in range(1,9) %}
  <div class="mb-3">
    <label class="form-label">Actividad {{ i }}</label>
    <input type="text" name="Actividad{{ i }}" class="form-control"
           value="{{ documento['Actividad'~i] or '' }}" required>
  </div>
  <div class="mb-3">
    <label class="form-label">Logro {{ i }}</label>
    <input type="text" name="Logro{{ i }}" class="form-control"
           value="{{ documento['Logro'~i] or '' }}" required>
  </div>
  {% endfor %}

  {% for i in range(1,9) %}
  <div class="row mb-3">
    <div class="col">
      <label class="form-label">Aprendizaje {{ i }}</label>
      <input type="text" name="Aprendizaje{{ i }}" class="form-control"
             value="{{ documento['Aprendizaje'~i] or '' }}" required>
    </div>
    <div class="col">
      <label class="form-label">Beneficio {{ i }}</label>
      <input type="text" name="Beneficio{{ i }}" class="form-control"
             value="{{ documento['Beneficio'~i] or '' }}" required>
    </div>
  </div>
  {% endfor %}

  <div class="mb-3">
    <label class="form-label">Nombre del Responsable</label>
    <input type="text" name="Nombre_Responsable" class="form-control"
           value="{{ documento.Nombre_Responsable or '' }}" required>
  </div>
  <div class="mb-3">
    <label class="form-label">Cargo del Responsable</label>
    <input type="text" name="Cargo_Responsable" class="form-control"
           value="{{ documento.Cargo_Responsable or '' }}" required>
  </div>

  <button type="submit" class="btn btn-primary">Guardar Reporte Final</button>
  <a href="{{ url_for('documentos_list') }}" class="btn btn-secondary">Cancelar</a>
</form>
{% endblock %}
