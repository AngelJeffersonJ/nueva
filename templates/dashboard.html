{% extends "layout.html" %}
{% block title %}Dashboard{% endblock %}
{% block content %}
<div class="row justify-content-center">
  <div class="col-md-6">
    <h3 class="text-center mb-4">Generar Documentos</h3>
    <div class="mb-3">
      <label for="no_control" class="form-label">No. de Control</label>
      <input type="text" id="no_control" class="form-control" placeholder="Ej. 2021001">
    </div>
    <div class="d-grid gap-2 d-md-flex justify-content-md-center">
      <button class="btn btn-primary" onclick="gen('solicitud')">Solicitud</button>
      <button class="btn btn-secondary" onclick="genB(1)">Bimestre 1</button>
      <button class="btn btn-secondary" onclick="genB(2)">Bimestre 2</button>
      <button class="btn btn-secondary" onclick="genB(3)">Bimestre 3</button>
      <button class="btn btn-success" onclick="gen('final')">Reporte Final</button>
    </div>
  </div>
</div>

<script>
  function gen(tipo) {
    let nc = document.getElementById('no_control').value.trim();
    if (!nc) { alert('Ingresa un No. de Control'); return; }
    window.location.href = '/generar_' + tipo + '/' + nc;
  }
  function genB(num) {
    let nc = document.getElementById('no_control').value.trim();
    if (!nc) { alert('Ingresa un No. de Control'); return; }
    window.location.href = '/generar_bimestral/' + num + '/' + nc;
  }
</script>
{% endblock %}
